
name: WakaTime Coding Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TITLE: true
          TIME_RANGE: all_time
          LANG_COUNT: 25
          SHOW_TIME: true
          SHOW_TOTAL: true
          BLOCKS: "░▒▓█"
          CODE_LANG: txt
